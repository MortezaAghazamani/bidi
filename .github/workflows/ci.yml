name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }} (Debug)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DBIDI_BUILD_TESTS=ON
          -DBIDI_BUILD_EXAMPLES=ON

      - name: Build
        run: cmake --build build --config Debug

      - name: Test
        run: ctest --test-dir build -C Debug --output-on-failure

  conformance:
    name: Conformance test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Unicode data files
        run: |
          mkdir -p tests/data
          curl -L -o tests/data/BidiCharacterTest.txt \
            https://www.unicode.org/Public/UCD/latest/ucd/BidiCharacterTest.txt

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build --config Debug

      - name: Run conformance test
        run: ./build/test_unicode_conformance tests/data/BidiCharacterTest.txt

  docs:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen

      - name: Configure
        run: cmake -S . -B build -DBIDI_BUILD_DOCS=ON

      - name: Build docs
        run: cmake --build build --target docs

      - name: Upload docs
        uses: actions/upload-artifact@v4
        with:
          name: docs
          path: build/docs/html
